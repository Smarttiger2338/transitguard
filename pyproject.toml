[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transitguard"
version = "0.1.0a29"
description = "Public transit transfer reliability analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TransitGuard Contributors" }]
keywords = ["public-transit", "routing", "transfer", "reliability", "mobility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["tzdata>=2024.1; platform_system == 'Windows'"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transitguard = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = [
  "live_tago: optional live TAGO API checks that require TAGO_SERVICE_KEY",
]
